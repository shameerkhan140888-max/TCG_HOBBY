name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://capital_hobby_group:capital_hobby_group@localhost:5432/capital_hobby_group?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: capital_hobby_group
          POSTGRES_PASSWORD: capital_hobby_group
          POSTGRES_DB: capital_hobby_group
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capital_hobby_group"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: tcg-hobby
        run: npm install
      - working-directory: tcg-hobby
        run: npm run db:generate
      - working-directory: tcg-hobby
        run: npm run typecheck
      - working-directory: tcg-hobby
        run: npm run test
      - working-directory: tcg-hobby
        run: npm run build
